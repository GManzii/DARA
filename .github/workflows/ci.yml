
name: DARA CI

on:
  push:
    branches: [main, testes-joca]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-playwright

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Check Django configuration
        run: python manage.py check

      - name: Prepare database
        run: python manage.py migrate --noinput

      - name: Start Django server
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > django.log 2>&1 &
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat django.log
          exit 1
          
      - name: Run Django tests
        run: python manage.py test core -v 2

      - name: Run E2E tests
        run: python -m pytest tests/e2e/ -v --browser chromium

      - name: Show Django logs if tests fail
        if: failure()
        run: cat django.log