
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha seu perfil</title>
</head>
<body>
    <h1>Bem-vindo!</h1>
    <p>Como você deseja acessar o aplicativo?</p>

    <form method="POST" action="{% url 'escolher_perfil' %}">
        {% csrf_token %}

        <button type="submit" name="perfil" value="dono">
            Sou dono
        </button>

        <button type="submit" name="perfil" value="funcionario">
            Sou funcionário
        </button>
    </form>

    <hr>
    <p>Já está logado? <a href="{% url 'perfil' %}">Ver meu Perfil</a></p>
</body>
</html>
